.ca-root{
  --ink:#132430; --ink2:#20394a; --line:#d8ded9; --paper:#eef1ec; --card:#fff;
  --muted:#5f7180; --pagado:#2f7d5b; --parcial:#c78a1e; --pendiente:#bd4237; --libre:#9aa8ae;
  --gold:#b8873a;
  background:var(--paper); min-height:100vh; color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
.ca-root *{box-sizing:border-box}
.ca-root button{font:inherit;cursor:pointer}
.ca-root input,.ca-root select{font:inherit}
.ca-root :focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.ca-top{background:var(--ink);color:#eef1ec;position:sticky;top:0;z-index:30}
.ca-top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;flex-wrap:wrap}
.ca-brand{display:flex;align-items:center;gap:11px}
.ca-brand-mark{width:36px;height:36px;border-radius:8px;background:var(--gold);color:#132430;display:grid;place-items:center;font-weight:800;letter-spacing:-.5px}
.ca-brand-t{font-weight:700;letter-spacing:-.2px}
.ca-brand-s{font-size:12px;color:#93a7b3}
.ca-month{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);border-radius:999px;padding:4px}
.ca-mbtn{background:none;border:0;color:#eef1ec;padding:6px;border-radius:999px;display:grid;place-items:center}
.ca-mbtn:hover{background:rgba(255,255,255,.12)}
.ca-mlabel{min-width:140px;text-align:center;font-weight:600;text-transform:capitalize;font-size:14px}
.ca-tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
.ca-tab{background:none;border:0;color:#93a7b3;padding:10px 14px;display:flex;align-items:center;gap:6px;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
.ca-tab.on{color:#fff;border-bottom-color:var(--gold)}

.ca-main{max-width:1120px;margin:0 auto;padding:18px 14px 60px;display:flex;flex-direction:column;gap:14px}
.ca-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.ca-h2{font-size:15px;font-weight:700;margin:0 0 12px;letter-spacing:-.2px}
.ca-h2s{font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.ca-h3{font-size:14px;font-weight:700;margin:0 0 10px}
.ca-p{color:var(--muted);font-size:13px;line-height:1.55;margin:0 0 12px}
.ca-empty{color:var(--muted);font-size:13px;margin:6px 0 0}

/* ---- la casa ---- */
.ca-house-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ca-legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.ca-legend .dot{width:9px;height:9px;border-radius:2px;display:inline-block;margin-left:6px}
.dot.pagado{background:var(--pagado)}.dot.parcial{background:var(--parcial)}
.dot.pendiente{background:var(--pendiente)}.dot.libre{background:var(--libre)}
.ca-building{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#f7f8f5}
.ca-floor{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px dashed var(--line)}
.ca-floor-tag{writing-mode:vertical-rl;transform:rotate(180deg);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:700}
.ca-rooms{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.ca-brick{flex:1 1 74px;min-width:66px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:8px 6px;display:flex;flex-direction:column;gap:2px;align-items:flex-start;transition:transform .12s ease}
.ca-brick:hover{transform:translateY(-2px)}
.ca-brick-n{font-weight:800;font-size:13px;font-family:ui-monospace,Menlo,monospace}
.ca-brick-m{font-size:11px;color:var(--muted);font-family:ui-monospace,Menlo,monospace}
.ca-brick.pagado{background:#e7f2ec;border-color:#a9cfbc}.ca-brick.pagado .ca-brick-n{color:var(--pagado)}
.ca-brick.parcial{background:#fbf1dc;border-color:#e3c88a}.ca-brick.parcial .ca-brick-n{color:#8a5f10}
.ca-brick.pendiente{background:#fbe9e7;border-color:#e3b0aa}.ca-brick.pendiente .ca-brick-n{color:var(--pendiente)}
.ca-brick.libre{background:#f1f3f1;opacity:.75}
.ca-brick.inactivo{background:#eceeec;opacity:.5}
.ca-ground{height:8px;background:repeating-linear-gradient(90deg,var(--ink) 0 12px,#2c4657 12px 24px)}

/* ---- estad\xEDsticas ---- */
.ca-grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.ca-stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;border-left-width:4px}
.ca-stat.in{border-left-color:var(--pagado)}.ca-stat.out{border-left-color:var(--pendiente)}
.ca-stat.net{border-left-color:var(--ink)}.ca-stat.warn{border-left-color:var(--parcial)}
.ca-stat.libre{border-left-color:var(--libre)}
.ca-stat-top{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px;font-weight:600}
.ca-stat-v{font-size:23px;font-weight:800;letter-spacing:-.8px;margin:6px 0 2px;font-family:ui-monospace,Menlo,monospace}
.ca-stat-s{font-size:11px;color:var(--muted)}

.ca-bar-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ca-num{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:18px}
.ca-bar{height:10px;background:#e3e7e2;border-radius:999px;overflow:hidden;margin:10px 0 6px}
.ca-bar-fill{height:100%;background:linear-gradient(90deg,var(--pagado),#4fa77c);transition:width .5s ease}
.ca-bar-legend{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}

/* ---- listas ---- */
.ca-list{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.ca-row{width:100%;display:flex;align-items:center;gap:10px;background:#f7f8f5;border:1px solid var(--line);border-radius:10px;padding:9px 11px;text-align:left}
.ca-row:hover{background:#f0f3ef}
.ca-row-code{font-family:ui-monospace,Menlo,monospace;font-weight:800;background:var(--ink);color:#fff;border-radius:5px;padding:3px 7px;font-size:12px}
.ca-row-main{flex:1;display:flex;flex-direction:column}
.ca-row-main small{color:var(--muted);font-size:11px}
.ca-row-amt{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:14px}
.ca-row-amt.debe{color:var(--pendiente)}

/* ---- filtros y tarjetas ---- */
.ca-filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ca-search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:9px;padding:7px 10px;flex:1;min-width:210px;color:var(--muted)}
.ca-search input{border:0;outline:0;flex:1;background:none;color:var(--ink)}
.ca-chips{display:flex;gap:5px;flex-wrap:wrap}
.ca-chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12px;text-transform:capitalize;color:var(--muted)}
.ca-chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.ca-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px}
.ca-rcard{text-align:left;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;display:flex;flex-direction:column;gap:7px}
.ca-rcard:hover{border-color:var(--ink2)}
.ca-rcard-h{display:flex;justify-content:space-between;align-items:center}
.ca-rcode{font-family:ui-monospace,Menlo,monospace;font-weight:800;font-size:16px}
.ca-tag{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:800;padding:3px 7px;border-radius:999px}
.ca-tag.pagado{background:#e7f2ec;color:var(--pagado)}
.ca-tag.parcial{background:#fbf1dc;color:#8a5f10}
.ca-tag.pendiente{background:#fbe9e7;color:var(--pendiente)}
.ca-tag.libre,.ca-tag.inactivo{background:#eef0ee;color:var(--muted)}
.ca-rname{font-weight:600;font-size:13px}
.ca-rnums{display:flex;gap:10px}
.ca-rnums span{display:flex;flex-direction:column}
.ca-rnums small{font-size:10px;color:var(--muted)}
.ca-rnums b{font-size:12px;font-family:ui-monospace,Menlo,monospace}
.ca-rnums b.ok{color:var(--pagado)} .ca-rnums b.bad{color:var(--pendiente)}
.ca-rdebt{font-size:11px;color:var(--pendiente);background:#fbe9e7;border-radius:6px;padding:4px 7px}

/* ---- panel lateral ---- */
.ca-overlay{position:fixed;inset:0;background:rgba(19,36,48,.55);display:flex;justify-content:flex-end;z-index:50}
.ca-sheet{background:var(--paper);width:100%;max-width:840px;height:100%;overflow-y:auto;box-shadow:-12px 0 40px rgba(0,0,0,.18)}
.ca-sheet-h{position:sticky;top:0;background:var(--ink);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.ca-sheet-h h2{margin:0;font-size:17px}
.ca-sheet-h p{margin:2px 0 0;font-size:12px;color:#93a7b3;text-transform:capitalize}
.ca-sheet-b{padding:14px}
.ca-sheet-grid{display:flex;flex-direction:column;gap:12px}
.ca-block{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px}
.ca-mini3{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.ca-mini3 span{display:flex;flex-direction:column}
.ca-mini3 small{font-size:11px;color:var(--muted)}
.ca-mini3 b{font-size:17px;font-family:ui-monospace,Menlo,monospace}
.ca-mini3 b.ok{color:var(--pagado)} .ca-mini3 b.bad{color:var(--pendiente)}
.ca-alert{background:#fbe9e7;color:#8c2f26;border-radius:8px;padding:8px 11px;font-size:12px;margin-bottom:10px}

.ca-payform,.ca-expform{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:10px}
.ca-payform input,.ca-payform select,.ca-expform input,.ca-expform select,.ca-field input{
  border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}
.ca-paylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.ca-paylist li{display:flex;align-items:center;gap:9px;background:#f7f8f5;border-radius:9px;padding:8px 10px;font-size:12px;flex-wrap:wrap}
.ca-pdate{font-family:ui-monospace,Menlo,monospace;color:var(--muted)}
.ca-pmethod{background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:11px}
.ca-pnote{color:var(--muted);flex:1;min-width:60px}
.ca-pamt{font-family:ui-monospace,Menlo,monospace;font-weight:800;color:var(--pagado)}
.ca-pamt.out{color:var(--pendiente)}
.ca-x{background:none;border:0;color:var(--muted);padding:4px;border-radius:6px;display:grid;place-items:center}
.ca-x:hover{color:var(--pendiente);background:#fbe9e7}
.ca-x.big{color:#93a7b3}.ca-x.big:hover{color:#fff;background:rgba(255,255,255,.12)}

.ca-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.ca-field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.ca-check{display:flex;align-items:center;gap:7px;font-size:13px;align-self:end;padding-bottom:9px}

.ca-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.ca-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;color:var(--ink);
  border-radius:9px;padding:9px 13px;font-size:13px;font-weight:600;text-decoration:none}
.ca-btn:hover{border-color:var(--ink2)}
.ca-btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.ca-btn.primary:hover{background:var(--ink2)}
.ca-btn.danger{color:var(--pendiente)}
.ca-btn.ghost{background:none}
.ca-btn.wide{width:100%;justify-content:center}
.ca-btn:disabled{opacity:.45;cursor:not-allowed}

.ca-file{display:flex;align-items:center;gap:10px;background:#f7f8f5;border-radius:9px;padding:10px;margin-bottom:10px}
.ca-file small{display:block;color:var(--muted);font-size:11px}
.ca-pdfbox{border:1px solid var(--line);border-radius:9px;overflow:hidden;height:420px;background:#fff}
.ca-pdfbox iframe{width:100%;height:100%;border:0}
.ca-drop{border:2px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:9px}
.ca-drop p{margin:0;font-size:13px;max-width:330px}
.ca-drop small{font-size:11px}

/* ---- documento imprimible ---- */
.ca-doc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:26px;margin-top:12px;
  font-family:Georgia,"Times New Roman",serif;position:relative}
.ca-doc-h{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid var(--ink);padding-bottom:14px;flex-wrap:wrap}
.ca-doc-kicker{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:2.4px;text-transform:uppercase;color:var(--gold);font-weight:800}
.ca-doc-h h1{font-size:21px;margin:4px 0 5px;letter-spacing:-.3px}
.ca-doc-h p{margin:1px 0;font-size:12px;color:var(--muted)}
.ca-doc-nro{text-align:right;font-family:ui-monospace,Menlo,monospace}
.ca-doc-nro small{display:block;font-size:10px;color:var(--muted)}
.ca-doc-nro b{font-size:17px}
.ca-doc-nro span{display:block;font-size:11px;color:var(--muted)}
.ca-doc-two{display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:16px 0;border-bottom:1px solid var(--line)}
.ca-doc-two h4{font-family:system-ui,sans-serif;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.ca-doc-two p{margin:1px 0;font-size:13px}
.ca-doc-two p.big{font-size:16px;font-weight:700}
.ca-doc-t{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
.ca-doc-t th{text-align:left;font-family:system-ui,sans-serif;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding:7px 5px}
.ca-doc-t td{padding:8px 5px;border-bottom:1px solid #eef1ec}
.ca-doc-t .r{text-align:right;font-family:ui-monospace,Menlo,monospace}
.ca-doc-t td.bad{color:var(--pendiente)}
.ca-doc-sum{margin-left:auto;max-width:330px;font-size:13px}
.ca-doc-sum div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eef1ec}
.ca-doc-sum b{font-family:ui-monospace,Menlo,monospace}
.ca-doc-sum .tot{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;font-size:15px;font-weight:700}
.ca-stamp{position:absolute;right:30px;bottom:96px;transform:rotate(-11deg);border:3px solid;border-radius:8px;
  padding:6px 16px;font-family:system-ui,sans-serif;font-weight:800;letter-spacing:2px;font-size:15px;opacity:.85}
.ca-stamp.ok{color:var(--pagado);border-color:var(--pagado)}
.ca-stamp.mid{color:var(--parcial);border-color:var(--parcial)}
.ca-stamp.bad{color:var(--pendiente);border-color:var(--pendiente)}
.ca-doc-f{display:flex;gap:40px;margin-top:56px;font-size:11px;color:var(--muted);font-family:system-ui,sans-serif}
.ca-doc-f div{flex:1;text-align:center}
.ca-doc-f span{display:block;border-top:1px solid var(--ink);margin-bottom:5px}

.ca-toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.22)}

@media (max-width:640px){
  .ca-doc{padding:16px}
  .ca-doc-two{grid-template-columns:1fr}
  .ca-stamp{position:static;transform:none;display:inline-block;margin-top:12px}
  .ca-mlabel{min-width:110px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){.ca-root *{transition:none!important}}
@media print{
  body *{visibility:hidden}
  #ca-print,#ca-print *{visibility:visible}
  #ca-print{position:absolute;left:0;top:0;width:100%;border:0;margin:0;padding:0}
  .ca-noprint{display:none!important}
}
